name: Build Liner Visuals (Forge 1.16.5)
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-liner.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project archive
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'LinerVisuals-forge-1.16.5-ready-project*.zip' -print -quit)"
          test -n "$archive"
          echo "PROJECT_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Extract project
        run: |
          mkdir source
          unzip -q "$PROJECT_ARCHIVE" -d source
          test -f source/linervisuals/gradlew
          test -f source/linervisuals/build.gradle
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Diagnose mappings and Freecam source
        working-directory: source/linervisuals
        run: |
          echo '--- build.gradle ---'
          cat build.gradle
          echo '--- Freecam.java ---'
          sed -n '1,180p' src/main/java/com/liner/visuals/Freecam.java
      - name: Fix official Minecraft mappings in Freecam
        working-directory: source/linervisuals
        run: |
          sed -i 's/net.minecraft.client.settings.GameSettings/net.minecraft.client.GameSettings/' src/main/java/com/liner/visuals/Freecam.java
          sed -i 's/GameSettings o = mc.options;/net.minecraft.client.GameSettings o = mc.options;/' src/main/java/com/liner/visuals/Freecam.java
      - name: Build with Gradle wrapper
        working-directory: source/linervisuals
        run: |
          chmod +x gradlew
          sed -i 's/gradle-8.4-all.zip/gradle-7.4.2-all.zip/' gradle/wrapper/gradle-wrapper.properties
          ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: '-Xmx3G'
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: LinerVisuals-Forge-1.16.5
          path: source/linervisuals/build/libs/*.jar
          if-no-files-found: error
